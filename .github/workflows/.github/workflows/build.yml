name: Android ROM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Derleme Ortamını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Repo Komutunu Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Android Kaynak Kodunu İndir
        run: |
          mkdir android-rom && cd android-rom
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --git-lfs
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

      - name: Cihaz Ağacını Ekleyin
        run: |
          cd android-rom
          # Buraya tabletinin Device Tree adresini klonlayacağız

      - name: ROM'u Derleyin
        run: |
          cd android-rom
          source build/envsetup.sh
          lunch lineage_MODEL-userdebug
          mka bacon -j$(nproc)

      - name: Zip Dosyasını Yükleyin
        uses: actions/upload-artifact@v3
        with:
          name: Custom-ROM-Zip
          path: android-rom/out/target/product/*/*.zip
